<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Astro Diário</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-shell">
        <header class="main-header">
            <h1>Astro<span class="gradient-text">Diário</span></h1>
            <p id="currentDate"></p>
        </header>

        <section class="daily-inspiration">
            <div class="quote-card">
                <span class="quote-icon">"</span>
                <p id="dailyQuote">A carregar a tua dose de luz...</p>
            </div>
        </section>

        <section class="horoscopo-section">
            <h2 class="section-title">Escolha o seu Signo</h2>
            <div class="sign-grid" id="signGrid"></div>
        </section>
    </div>

    <div class="modal" id="signModal">
        <div class="modal-sheet">
            <div class="modal-head">
                <div class="modal-info">
                    <span id="modalSymbol" class="modal-symbol"></span>
                    <div>
                        <h2 id="modalTitle">---</h2>
                        <p id="modalDates"></p>
                    </div>
                </div>
                <button class="modal-close" id="modalClose">✕</button>
            </div>
            
            <div class="modal-body">
                <p id="modalSummary" class="main-text"></p>

                <div class="lucky-numbers">
                    <p>Números da Sorte:</p>
                    <div id="luckyBalls" class="balls-container"></div>
                </div>

                <div class="forecast-grid">
                    <div class="forecast-box"><strong>❤️ Amor</strong><p id="modalLove"></p></div>
                    <div class="forecast-box"><strong>💼 Trabalho</strong><p id="modalWork"></p></div>
                    <div class="forecast-box"><strong>🌿 Saúde</strong><p id="modalWellness"></p></div>
                    <div class="forecast-box"><strong>🍀 Conselho</strong><p id="modalAdvice"></p></div>
                </div>
                
                <div class="lucky-color-row">
                    <span id="modalLuckyColor"></span>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
