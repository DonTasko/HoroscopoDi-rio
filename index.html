<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Astro Diário</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-shell">
        <header class="topbar">
            <strong>Astro Diário</strong>
        </header>

        <main>
            <section class="hero">
                <div class="daily-card">
                    <strong id="featuredSignTitle">Carregando...</strong>
                    <p id="featuredSignText">Sincronizando com as estrelas...</p>
                </div>
            </section>

            <section id="horoscopo">
                <div class="sign-grid" id="signGrid">
                    </div>
            </section>
        </main>

        <nav class="bottom-nav">
            <ul>
                <li><a href="#home">✨ Início</a></li>
                <li><a href="#horoscopo">♈ Signos</a></li>
            </ul>
        </nav>
    </div>

    <div class="modal" id="signModal">
        <div class="modal-sheet">
            <div class="modal-head">
                <div class="modal-title-wrap">
                    <span id="modalSymbol" class="modal-symbol"></span>
                    <div>
                        <h2 id="modalTitle">Signo</h2>
                        <p id="modalDates"></p>
                    </div>
                </div>
                <button class="modal-close" id="modalClose">✕</button>
            </div>
            
            <div class="modal-body">
                <p id="modalSummary" class="main-summary"></p>
                <div class="forecast-grid">
                    <div class="forecast-box"><strong>❤️ Amor</strong><p id="modalLove"></p></div>
                    <div class="forecast-box"><strong>💼 Trabalho</strong><p id="modalWork"></p></div>
                    <div class="forecast-box"><strong>🌿 Saúde</strong><p id="modalWellness"></p></div>
                    <div class="forecast-box"><strong>🍀 Conselho</strong><p id="modalAdvice"></p></div>
                </div>
                <div id="modalLuckyColor" class="lucky-badge"></div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>
    <script src="script.js"></script>
</body>
</html>
