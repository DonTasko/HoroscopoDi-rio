<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Astro Diário</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-shell">
        <div id="ad-slot-top" class="ad-slot">Espaço Publicitário</div>

        <section class="hero">
            <div class="daily-card">
                <strong id="featuredSignTitle">---</strong>
                <p id="featuredSignText">Sincronizando constelações...</p>
            </div>
        </section>

        <div class="sign-grid" id="signGrid"></div>

        <div id="ad-slot-bottom" class="ad-slot" style="min-height: 100px;">Publicidade</div>
    </div>

    <div class="modal" id="signModal">
        <div class="modal-sheet">
            <div class="modal-head">
                <div style="display:flex; align-items:center;">
                    <span id="modalSymbol" class="modal-symbol"></span>
                    <div>
                        <h2 id="modalTitle">---</h2>
                        <p id="modalDates" style="color:var(--text-dim); font-size:0.8rem;"></p>
                    </div>
                </div>
                <button class="modal-close" id="modalClose">✕</button>
            </div>
            
            <p id="modalSummary" style="margin-bottom:20px;"></p>

            <div class="forecast-grid">
                <div class="forecast-box"><strong>❤️ Amor</strong><p id="modalLove"></p></div>
                <div class="forecast-box"><strong>💼 Trabalho</strong><p id="modalWork"></p></div>
                <div class="forecast-box"><strong>🌿 Saúde</strong><p id="modalWellness"></p></div>
                <div class="forecast-box"><strong>🍀 Conselho</strong><p id="modalAdvice"></p></div>
            </div>
            <p id="modalLuckyColor" style="text-align:center; color:var(--accent); font-weight:bold;"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
